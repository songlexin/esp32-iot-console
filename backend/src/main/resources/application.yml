server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: iot-console
  datasource:
    url: jdbc:h2:file:${H2_PATH:./data/iot};DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  mqtt:
    host: ${MQTT_HOST:localhost}
    port: ${MQTT_PORT:1883}
    client-id: ${MQTT_CLIENT_ID:iot-console-backend}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    auto-connect: ${MQTT_AUTO_CONNECT:true}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1}
  telemetry:
    history-limit: ${TELEMETRY_HISTORY_LIMIT:200}
    stale-after-seconds: ${DEVICE_STALE_AFTER_SECONDS:30}
