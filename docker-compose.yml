services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: iot-backend
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_CLIENT_ID: iot-console-backend
      SERVER_PORT: 8080
      H2_PATH: /data/iot
      CORS_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:8088,http://127.0.0.1:8088,http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: iot-frontend
    depends_on:
      - backend
    ports:
      # 8088 avoids colliding with a system nginx that often already owns Windows port 80
      - "8088:80"
    restart: unless-stopped

  simulator:
    build: ./simulator
    container_name: iot-simulator
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      DEVICE_COUNT: 2
      DEVICE_NAMES: 模拟器 01,模拟器 02
      INTERVAL_MS: 4000
    restart: unless-stopped

volumes:
  backend-data:
